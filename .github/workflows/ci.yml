name: CI

on:
  push:

jobs:
  powershell-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -MinimumVersion 1.24.0 -Scope CurrentUser -Force
      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $settings = Join-Path $PWD 'PSScriptAnalyzerSettings.psd1'
          $findings = @(
            Invoke-ScriptAnalyzer -Path (Join-Path $PWD 'scripts') -Recurse -Settings $settings
            Invoke-ScriptAnalyzer -Path (Join-Path $PWD '.codex\skills\onec-pipeline') -Recurse -Settings $settings
          )
          $findings | Format-Table -AutoSize
          if ($findings.Count -gt 0) { throw "PSScriptAnalyzer reported $($findings.Count) finding(s)." }
      - name: Run Pester
        shell: pwsh
        run: .\.codex\skills\onec-pipeline\tests\Invoke-PipelineMvpTests.ps1
      - name: Publish Pester report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-nunit
          path: TestResults/pester-nunit.xml
